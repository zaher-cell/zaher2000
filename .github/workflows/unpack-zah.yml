name: Unpack zah.zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack zah.zip
        run: |
          set -e
          test -f zah.zip

          rm -rf extracted
          mkdir extracted

          unzip -q zah.zip -d extracted

          # نسخ الملفات مع الحفاظ على الهيكل والمحتوى
          cp -a extracted/. .

          # حذف الملفات المؤقتة
          rm -rf extracted
          rm -f zah.zip

      - name: Commit and push safely
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Unpack zah.zip"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
