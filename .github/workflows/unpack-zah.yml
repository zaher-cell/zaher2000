name: Unpack zah.zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Unpack zah.zip
        run: |
          set -euo pipefail

          if [ ! -f "zah.zip" ]; then
            echo "ERROR: zah.zip not found"
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted

          unzip -q zah.zip -d extracted

          cp -a extracted/. .

          rm -rf extracted
          rm -f zah.zip

      - name: Sync with latest main and push
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Unpack zah.zip"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main

      - name: Verify
        run: |
          set -euo pipefail

          if [ -f "zah.zip" ]; then
            echo "ERROR: zah.zip still exists"
            exit 1
          fi

          if [ ! -d "whatsapp-restaurant-bot" ]; then
            echo "ERROR: extracted project folder is missing"
            exit 1
          fi

          echo "SUCCESS: zah.zip was unpacked and removed successfully."
