name: Unpack zah.zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack ZIP
        run: |
          set -e
          rm -rf extracted
          mkdir extracted
          unzip -q zah.zip -d extracted

          cp -a extracted/. .

          rm -rf extracted

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git rm -f zah.zip
          git commit -m "Unpack zah.zip" || echo "No changes"
          git push
